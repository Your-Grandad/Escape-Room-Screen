<!doctype html>
<html lang="{{ current_locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t("login.title") }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='screen.css') }}">
  </head>
  <body class="admin-page">
    <main class="panel login-panel">
      <h1>{{ t("login.title") }}</h1>
      {% if password_changed %}<p>{{ t("login.password_changed") }}</p>{% endif %}
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post">
        <label>{{ t("login.username") }} <input name="username" autocomplete="username" required autofocus></label>
        <label>{{ t("login.password") }} <input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
        <label><input id="show-password" type="checkbox"> {{ t("login.show_password") }}</label>
        <button type="submit">{{ t("login.sign_in") }}</button>
      </form>
      {% include "includes/language_selector.html" %}
    </main>
    <script src="{{ url_for('static', filename='login.js', v='1') }}"></script>
  </body>
</html>
