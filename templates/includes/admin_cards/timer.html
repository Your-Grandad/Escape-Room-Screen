<section class="control-card" data-control-id="timer">
  <div class="timer-adjust">
    <h2>{{ t("timer.adjust") }}</h2>
    <p>{{ t("timer.description") }}</p>
    <div class="timer-adjust-buttons timer-adjust-presets">
      <button type="button" data-adjust-seconds="60">{{ t("timer.add_minute") }}</button>
      <button type="button" data-adjust-seconds="-60">{{ t("timer.remove_minute") }}</button>
    </div>
    <form id="timer-adjust-fields" class="timer-adjust-row">
      <label for="timer-adjust-minutes">{{ t("timer.minutes") }}
        <input id="timer-adjust-minutes" type="number" min="0" max="59" step="1" value="1" inputmode="numeric">
      </label>
      <label for="timer-adjust-seconds">{{ t("timer.seconds") }}
        <input id="timer-adjust-seconds" type="number" min="0" max="59" step="1" value="0" inputmode="numeric">
      </label>
      <div class="timer-adjust-buttons">
        <button type="button" data-adjust-combined="1" aria-label="{{ t("timer.add_time") }}" title="{{ t("timer.add_time") }}">+</button>
        <button type="button" data-adjust-combined="-1" aria-label="{{ t("timer.remove_time") }}" title="{{ t("timer.remove_time") }}">−</button>
      </div>
    </form>
  </div>
</section>
