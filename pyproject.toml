[project]
name = "escape-room-screen"
version = "0.1.0"
description = "Raspberry Pi kiosk display and control panel for escape rooms"
authors = [
    {name = "Alex Barber",email = "alex8mpn@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "gpiozero (>=2.0.1.post3,<3.0.0)",
    "lgpio (>=0.2.2.0,<0.3.0.0); sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l')"
]

[tool.poetry]
packages = [{include = "escape_room_screen", from = "src"}]
include = [{path = "src/escape_room_screen/translations/*.json", format = ["sdist", "wheel"]}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
